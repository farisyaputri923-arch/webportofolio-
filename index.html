<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>♡ My Coquette Portfolio</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',cursive}
body{background:#ffe6f0 url('https://i.pinimg.com/736x/8a/7a/9c/8a7a9c...'); background: linear-gradient(135deg,#ffd6e8,#ffedf5,#ffc2d9);min-height:100vh;overflow:hidden}
.menubar{background:rgba(255,255,255,.7);backdrop-filter:blur(10px);padding:8px 20px;display:flex;justify-content:space-between;font-size:14px;color:#a14a6e}
.window{width:90%;max-width:900px;margin:20px auto;background:#fff5f8;border-radius:16px;box-shadow:0 20px 60px rgba(255,105,180,.3);border:2px solid #ffb3c9;overflow:hidden;position:relative;z-index:2}
.titlebar{background:linear-gradient(#ffd0e0,#ffb3c9);padding:12px;display:flex;align-items:center;gap:8px}
.dot{width:14px;height:14px;border-radius:50%;cursor:pointer}
.red{background:#ff5f57}.yellow{background:#febc2e}.green{background:#28c840}
.tabs{display:flex;gap:10px;padding:12px;background:#ffeaf2;flex-wrap:wrap;justify-content:center}
.tabs button{background:white;border:2px solid #ffb3c9;color:#c94f7c;padding:8px 18px;border-radius:20px;cursor:pointer;transition:.3s;font-weight:bold}
.tabs button.active,.tabs button:hover{background:#ff8fb3;color:white;transform:scale(1.05)}
.content{padding:30px;min-height:380px;animation:fade.5s}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1}}
h1{color:#c94f7c;font-style:italic}
.ribbon{position:fixed;top:-50px;font-size:28px;animation:fall linear infinite;z-index:1;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
.card{background:white;padding:20px;border-radius:15px;border:1px dashed #ff8fb3;margin:15px 0;box-shadow:0 5px 15px rgba(255,143,179,.2)}
.dock{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.6);backdrop-filter:blur(10px);padding:10px 20px;border-radius:20px;display:flex;gap:15px;border:1px solid #ffb3c9;z-index:3}
.dock span{font-size:28px;cursor:pointer;transition:.3s}.dock span:hover{transform:scale(1.4) translateY(-5px)}
input,textarea{width:100%;padding:12px;margin:8px 0;border:2px solid #ffb3c9;border-radius:12px;background:#fff}
.btn{background:#ff8fb3;color:white;border:none;padding:12px 30px;border-radius:25px;cursor:pointer;font-weight:bold}
@media(max-width:600px){.content{padding:20px}.window{width:95%}}
</style>
</head>
<body>
<div class="menubar"><div>♡ coquetteOS</div><div id="clock"></div></div>

<div class="window">
<div class="titlebar">
<div class="dot red" onclick="closeWin()"></div>
<div class="dot yellow" onclick="minWin()"></div>
<div class="dot green" onclick="maxWin()"></div>
<span style="margin-left:10px;color:#a14a6e">♡ my-portfolio.app</span>
</div>
<div class="tabs">
<button class="active" onclick="show('beranda',this)">🎀 Beranda</button>
<button onclick="show('riwayat',this)">📜 Riwayat</button>
<button onclick="show('profil',this)">💖 Profil</button>
<button onclick="show('pengalaman',this)">✨ Pengalaman</button>
<button onclick="show('kontak',this)">💌 Kontak</button>
</div>
<div class="content" id="main"></div>
</div>

<div class="dock"><span>🎀</span><span>💗</span><span>🌸</span><span>🦢</span><span>💌</span></div>

<script>
const pages={
beranda:`<h1>Bonjour, Princess! 🎀</h1><br><div class="card"><p>Halo aku <b>Farisya Maisara Putri</b>, seorang dreamer & creator yang suka hal-hal manis bernuansa coquette. Selamat datang di dunia pink-ku!</p></div><div class="card">🎀 aesthetic • 🌸 soft • 💖 dreamy</div>`,
riwayat:`<h1>Riwayat Pendidikan 📜</h1><div class="card"><b>2026-2027</b> - SMKN 4<br><b>2026-Sekarang</b> - belajar ngoding</div><div class="card">Selalu berprestasi dengan cinta 🎀</div>`,
profil:`<h1>Profil Ku 💖</h1><div class="card" style="text-align:center"><div style="font-size:80px">👸🏻</div><p><b>Nama:</b> farisya<br><b>umur:</b> 15<br><b>Hobi:</b> silat</p></div>`,
pengalaman:`<h1>Pengalaman ✨</h1><div class="card">💗 kalah lomba di final</div><div class="card">🎀 ikut organisasi osis</div><div class="card">🌸 panitia lomba Agustus</div>`,
kontak:`<h1>Hubungi Aku 💌</h1><div class="card"><input placeholder="nama saya"><input placeholder="kontak"><textarea placeholder="pesan manis "></textarea><br><button class="btn" onclick="alert('Pesan terkirim dengan cinta! 💖')">Kirim 🎀</button></div>`
};
function show(p,btn){document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');document.getElementById('main').innerHTML=pages[p];}
show('beranda',document.querySelector('.tabs button'));
function closeWin(){alert('Jangan ditutup dong! 🎀')}
function minWin(){document.querySelector('.window').style.transform='scale(.9)';setTimeout(()=>document.querySelector('.window').style.transform='scale(1)',300)}
function maxWin(){document.querySelector('.window').style.maxWidth=document.querySelector('.window').style.maxWidth=='1100px'?'900px':'1100px'}
// pita jatuh
const ribbons=['🎀','💗','🌸','💖','🎀','🩰'];
setInterval(()=>{let r=document.createElement('div');r.className='ribbon';r.innerHTML=ribbons[Math.floor(Math.random()*ribbons.length)];r.style.left=Math.random()*100+'vw';r.style.animationDuration=(3+Math.random()*4)+'s';document.body.appendChild(r);setTimeout(()=>r.remove(),7000)},400);
// jam
setInterval(()=>{document.getElementById('clock').innerHTML=new Date().toLocaleTimeString()},1000);
</script>
</body>
</html>
